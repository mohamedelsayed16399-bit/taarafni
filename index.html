<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(160deg,#4c1d95,#6d28d9 45%,#db2777);min-height:100vh;color:#1f1535;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 40px}
.card{background:#fff;border-radius:22px;padding:22px 18px;box-shadow:0 10px 30px rgba(0,0,0,.25);margin-top:14px}
h1{margin:0;color:#fff;text-align:center;font-size:28px}
.sub{color:#fde7ff;text-align:center;margin:6px 0 0;font-size:15px}

.btn.wa{background:#16a34a}
.btn[disabled]{opacity:.45}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{padding:14px;font-size:17px;text-align:right;background:#f5f1ff;color:#2b1a5a;border:2px solid transparent}
.opt.sel{border-color:#7c3aed;background:#ede4ff}
.opt.ok{background:#dcfce7;border-color:#16a34a}
.opt.no{background:#fee2e2;border-color:#dc2626}

.foot{color:#f3d9ff;text-align:center;font-size:13px;margin-top:22px}
.hide{display:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:20px;font-size:15px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
</style>

<body>

<div class="toast" id="toast"></div>
<script>
"use strict";
var BANK=[
["أكلتي المفضلة؟",["كشري","فراخ مشوية","شاورما","محشي"]],
["أنا في الصباح؟",["محتاج قهوة وسيبوني","نشيط من الفجر","بصحى متأخر","مبصحاش أصلاً"]],
["لو معايا إجازة أسبوع هروح؟",["الساحل","شرم أو دهب","أسوان أو الأقصر","أقعد في البيت"]],
["أكتر حاجة بتضايقني؟",["الزحمة","الكدب","التأخير في المواعيد","الصوت العالي"]],
["مشروبي الأساسي؟",["شاي","قهوة","عصير","بيبسي"]],
["لو هاخرج مع أصحابي هنروح؟",["كافيه","مطعم","سينما","نتمشى"]],
["سلاحي في الخناقة؟",["الهزار","الصمت","الصوت العالي","المنطق"]],
["أنا بسيب الرسايل؟",["بقرا وأنسى أرد","بردّ في ثانية","بسيبها أيام","بحب أتصل بدل ما اكتب"]],
["أهم حاجة في الصاحب؟",["يسندني وقت الشدة","يضحكني","يحافظ على سري","ميغيبش عني"]],
["لو كسبت مليون جنيه؟",["أشتري عربية","أسافر","أبدأ مشروع","أحوّشهم"]],
["أنا أكتر في الجروب؟",["بتكلم في كل حاجة","بقرا وساكت","باعت ميمز","مبدخلش أصلاً"]],
["أحسن وقت في اليوم؟",["الصبح بدري","العصر","بالليل","بعد نص الليل"]],
["مسلسلات ولا أفلام؟",["مسلسلات","أفلام","كورة بس","مفيش وقت"]],
["أكتر حاجة بخاف منها؟",["الفشل","الوحدة","الصراصير","الظلام"]],
["لو هتغير حاجة في نفسي؟",["أبقى أهدى","أبقى أنظم","أبقى أجرأ","مفيش، أنا تمام"]],
["أسلوبي في الفلوس؟",["بصرف أول بأول","بحوّش","بدّي لغيري","بحسبها لآخر جنيه"]],
["هدية أحبها؟",["حاجة عملتها بإيدك","موبايل أو جهاز","هدوم","فلوس"]],
["الإجازة المثالية؟",["نوم","خروجة مع الشلة","سفر","شغل على مشروعي"]],
["لو قلت لي سر هتلاقيني؟",["قبرك","بحكيه لأقرب واحد","بنسى في ثانية","بقوله بالتلميح"]],
["أول حاجة بعملها لما أصحى؟",["أمسك الموبايل","أشرب مية","أعمل شاي أو قهوة","أرجع أنام"]],
["أسوأ عادة عندي؟",["بأجل كل حاجة","بتأخر","بزهق بسرعة","بتكلم كتير"]],
["أحب أكون؟",["غني ومشغول","فقير ومرتاح","مشهور","مجهول وهادي"]],
["في الرحلات أنا اللي؟",["بيخطط كل حاجة","بيجيب الأكل","بيصور","بينام في العربية"]],
["لو قابلت حد رخم؟",["أتجاهله","أرد عليه","أهزر معاه","أمشي"]],
["أغنية تعبر عني؟",["شعبي","راب","كلاسيك طرب","بوب أجنبي"]],
["النوم عندي؟",["بدري","متأخر","أي وقت","أرق مزمن"]],
["أكتر تطبيق بفتحه؟",["واتساب","تيك توك","فيسبوك","يوتيوب"]],
["الحب بالنسبة لي؟",["أهم حاجة","مش أولوية","لازم أمان قبله","لسه مش متأكد"]],
["لو معايا فرصة أسافر بره؟",["أشتغل هناك","أدرس","أسافر سياحة بس","أفضل في مصر"]],
["قرار كبير باخده؟",["بسرعة من قلبي","بعد تفكير طويل","بسأل ناس","بسيب الوقت يقرر"]]
];
var N=10, LS="taarafni_v1";
var app=document.getElementById("app");
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(t){var e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(function(){e.classList.remove("on")},1800)}
function load(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return{}}}
function save(d){try{localStorage.setItem(LS,JSON.stringify(d))}catch(e){}}
function base(){return location.origin+location.pathname}
function key(name,code){var s=name+"|"+code,h=5381;for(var i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h.toString(36)}
/* quiz code: N pairs "qq a" (qq=2 digits question idx, a=answer idx) */
function mkLink(name,code,cu){return base()+"#q="+encodeURIComponent(name)+"~"+code+(cu?"~"+encodeURIComponent(cu):"")}
function parseHash(){
  var h=location.hash.replace(/^#/,"");
  var m=h.match(/^q=([^~]*)~(\d+)(?:~([^~]+))?$/);
  if(m&&m[2].length%3===0){
    var qs=[],i;for(i=0;i<m[2].length;i+=3){var q=+m[2].substr(i,2),a=+m[2].substr(i+2,1);if(q>=BANK.length||a>3)return null;qs.push([q,a])}
    if(!qs.length)return null;
    var nm;try{nm=decodeURIComponent(m[1])}catch(e){return null}
    var cu=null;if(m[3]){try{var pp=decodeURIComponent(m[3]).split("|");if(pp.length===6&&+pp[5]>=0&&+pp[5]<4&&pp[0])cu={q:pp[0].slice(0,120),o:pp.slice(1,5).map(function(x){return x.slice(0,60)}),a:+pp[5]}}catch(e){}}
    return {type:"quiz",name:nm.slice(0,30),qs:qs,code:m[2],cu:cu,cuRaw:m[3]||""};
  }
  m=h.match(/^r=([^~]*)~([^~]*)~(\d+)~(\d+)(?:~([01]+))?$/);
  if(m){try{return {type:"res",quiz:m[1],who:decodeURIComponent(m[2]).slice(0,30),score:Math.min(+m[3],20),of:Math.min(+m[4],20),mask:m[5]||""}}catch(e){}}
  return null;
}
function confetti(){var c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9";document.body.appendChild(c);c.width=innerWidth;c.height=innerHeight;var x=c.getContext("2d"),P=[],cl=["#fbbf24","#ec4899","#22c55e","#60a5fa","#fff"];for(var i=0;i<120;i++)P.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*4,w:6+Math.random()*6,c:cl[i%5],r:Math.random()*6});var f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(function(p){p.y+=p.v;p.x+=Math.sin(p.y/30);p.r+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);x.restore()});if(++f<220)requestAnimationFrame(a);else c.remove()})()}
function rankOf(p){
  if(p>=1)return ["🏆","أنت أقرب واحد ليّ، يعرفني أكتر من نفسي!"];
  if(p>=.8)return ["🥇","صاحب الصاحب، يعرفني كويس جداً"];
  if(p>=.6)return ["🥈","عارفني حلو بس لسه فيه أسرار"];
  if(p>=.4)return ["🥉","نص نص، محتاجين نقعد مع بعض أكتر"];
  if(p>=.2)return ["😅","يا راجل؟ إحنا لسه بنتعرف"];
  return ["🕵️","غريب تماماً! عرّف نفسك من الأول"];
}
function home(){
  var d=load(),mine=d.mine||[],h="";
  document.title="تعرفني قد إيه؟ | اختبر أصحابك";
  $("#tag").textContent="اعمل اختبارك وشوف مين فعلاً يعرفك";
  h+='<div class="card"><h2>🎯 اعمل اختبارك</h2><p>جاوب على 10 أسئلة عن نفسك، وابعت الرابط لأصحابك على واتساب. كل واحد هيجاوب ويطلعله تقييم، وإنت تشوف ترتيبهم.</p><input type="text" id="nm" maxlength="30" placeholder="اسمك" autocomplete="off" value="'+esc(d.name||"")+'"><button class="btn" id="go">يلا نبدأ</button></div>';
  if(mine.length){
    h+='<div class="card"><h2>📋 اختباراتك</h2>';
    mine.slice().reverse().slice(0,5).forEach(function(q){
      var f=(d.friends||{})[q.key]||[];
      h+='<div class="row"><span>'+esc(q.name)+' <span class="tag">'+f.length+' جاوبوا</span></span><span><button class="tag" data-lb="'+q.key+'" style="border:0">النتائج</button> <button class="tag" data-sh="'+q.key+'" style="border:0">ابعت</button></span></div>';
    });
    h+='</div>';
  }
  app.innerHTML=h;
  $("#go").onclick=function(){var n=$("#nm").value.trim();if(!n){toast("اكتب اسمك الأول");return}d=load();d.name=n;save(d);build(n)};
  $("#nm").onkeydown=function(e){if(e.key==="Enter")$("#go").click()};
  [].forEach.call(document.querySelectorAll("[data-lb]"),function(b){b.onclick=function(){board(b.dataset.lb)}});
  [].forEach.call(document.querySelectorAll("[data-sh]"),function(b){b.onclick=function(){var q=(load().mine||[]).filter(function(x){return x.key===b.dataset.sh})[0];if(q)shareQuiz(q.name,q.code,q.cu)}});
}
function pick(){var ids=BANK.map(function(_,i){return i});for(var i=ids.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=ids[i];ids[i]=ids[j];ids[j]=t}return ids.slice(0,N)}
function build(name){
  var ids=pick(),ans=[],i=0;
  function step(){
    if(i>=ids.length)return done();
    var q=BANK[ids[i]],h='<div class="card"><div class="meta"><span>سؤال '+(i+1)+' من '+N+'</span><span>جاوب عن نفسك</span></div><div class="bar"><i style="width:'+(i/N*100)+'%"></i></div><h2 style="margin-top:16px">'+esc(q[0])+'</h2><div class="opts">';
    q[1].forEach(function(o,k){h+='<button class="opt" data-k="'+k+'">'+esc(o)+'</button>'});
    h+='</div>'+(i?'<button class="btn alt" id="back">رجوع</button>':'')+'</div>';
    app.innerHTML=h;
    [].forEach.call(document.querySelectorAll(".opt"),function(b){b.onclick=function(){ans[i]=+b.dataset.k;i++;step()}});
    if(i){$("#back").onclick=function(){i--;step()}}
  }
  function done(){
    var code=ids.map(function(q,k){return (q<10?"0":"")+q+ans[k]}).join("");
    app.innerHTML='<div class="card"><h2>✍️ سؤال من تأليفك (اختياري)</h2><p>اكتب سؤال خاص بيك وأربع اختيارات، وحدد إجابتك. الأصحاب هيتخانقوا عليه 😄</p><input type="text" id="cq" maxlength="120" placeholder="سؤالك"><div id="co"></div><p style="margin-bottom:0">إجابتك الصح:</p><div class="opts" id="ca" style="grid-template-columns:repeat(4,1fr)"></div><button class="btn" id="cf">كمّل</button><button class="btn alt" id="cs">تخطي</button></div>';
    var co=$("#co"),ca=$("#ca"),pa=-1;
    for(var z=0;z<4;z++){var inp=document.createElement("input");inp.type="text";inp.maxLength=60;inp.placeholder="اختيار "+(z+1);inp.style.marginTop="8px";inp.className="cop";co.appendChild(inp);var bb=document.createElement("button");bb.className="opt";bb.textContent=z+1;bb.style.textAlign="center";bb.dataset.k=z;ca.appendChild(bb);bb.onclick=function(){pa=+this.dataset.k;[].forEach.call(ca.children,function(x){x.classList.toggle("sel",+x.dataset.k===pa)})}}
    $("#cs").onclick=function(){fin2(null)};
    $("#cf").onclick=function(){
      var qt=$("#cq").value.trim().replace(/[|~#]/g," "),os=[].map.call(document.querySelectorAll(".cop"),function(x){return x.value.trim().replace(/[|~#]/g," ")});
      if(!qt||os.some(function(x){return !x})||pa<0){toast("اكتب السؤال والأربع اختيارات واختار الإجابة");return}
      fin2([qt].concat(os,[pa]).join("|"));
    };
    function fin2(cu){
    var d=load();d.mine=d.mine||[];var k=key(name,code+(cu||""));
    if(!d.mine.some(function(x){return x.key===k}))d.mine.push({key:k,name:name,code:code,cu:cu,t:Date.now()});
    save(d);
    var link=mkLink(name,code,cu);
    app.innerHTML='<div class="card"><div class="big">✅</div><h2 style="text-align:center">اختبارك جاهز يا '+esc(name)+'!</h2><p style="text-align:center">ابعته لأصحابك وشوف مين هياخد أعلى درجة.</p><button class="btn wa" id="wa">ابعت على واتساب</button><button class="btn alt" id="cp">انسخ الرابط</button><button class="btn alt" id="hm">الرئيسية</button></div>';
    $("#wa").onclick=function(){shareQuiz(name,code,cu)};
    $("#cp").onclick=function(){copy(link)};
    $("#hm").onclick=function(){location.hash="";home()};
    }
  }
  step();
}
function copy(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("اتنسخ ✔")},function(){fb(t)})}else fb(t);
  function fb(t){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("اتنسخ ✔")}catch(e){toast("انسخه يدوي")}a.remove()}
}
function shareQuiz(name,code,cu){
  var link=mkLink(name,code,cu),txt="تفتكر تعرفني قد إيه؟ 🤔 جاوب 10 أسئلة عني وشوف هتجيب كام من 10:\n"+link;
  openShare(txt,link,"تعرفني قد إيه؟");
}
function openShare(txt,link,title){
  if(navigator.share){navigator.share({title:title,text:txt,url:link}).catch(function(){})}
  else window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank");
}
function qList(q){var L=q.code?q.code.match(/.{3}/g).map(function(t){var b=BANK[+t.substr(0,2)];return {t:b[0],o:b[1],a:+t[2]}}):[];if(q.cu){var p=q.cu.split("|");L.push({t:p[0],o:p.slice(1,5),a:+p[5]})}return L}
function board(k){
  var d=load(),q=(d.mine||[]).filter(function(x){return x.key===k})[0];if(!q)return home();
  var f=((d.friends||{})[k]||[]).slice().sort(function(a,b){return b.score-a.score}),QL=qList(q);
  var h='<div class="card"><h2>🏅 ترتيب أصحاب '+esc(q.name)+'</h2>';
  if(!f.length)h+='<p>لسه محدش بعتلك نتيجته. لما صاحبك يخلص هيبعتلك رسالة فيها رابط، افتحه وهتتسجل هنا.</p>';
  f.forEach(function(x,i){h+='<div class="row" data-fi="'+i+'" style="cursor:pointer"><span>'+(i===0?"👑 ":(i+1)+". ")+esc(x.who)+'</span><span class="tag">'+x.score+'/'+x.of+'</span></div><div class="rev hide" id="fi'+i+'"></div>'});
  var wm=f.filter(function(x){return x.mask&&x.mask.length===QL.length});
  if(wm.length){
    var miss=QL.map(function(_,j){return wm.filter(function(x){return x.mask[j]==="0"}).length});
    var worst=miss.indexOf(Math.max.apply(null,miss)),best=miss.indexOf(Math.min.apply(null,miss));
    if(Math.max.apply(null,miss)>0)h+='<div class="rev"><b>😵 أكتر سؤال اتغلط فيه ('+miss[worst]+' من '+wm.length+')</b>'+esc(QL[worst].t)+' ← '+esc(QL[worst].o[QL[worst].a])+'</div>';
    h+='<div class="rev"><b>🎯 أسهل سؤال ('+(wm.length-miss[best])+' من '+wm.length+' جاوبوه صح)</b>'+esc(QL[best].t)+'</div>';
    var avg=wm.reduce(function(s,x){return s+x.score/x.of},0)/wm.length;
    h+='<div class="rev"><b>📊 متوسط أصحابك</b>'+Math.round(avg*100)+'% يعرفوك</div>';
  }
  if(f.length)h+='<button class="btn wa" id="chal">تحدّي الأصحاب تاني 🔁</button>';
  h+='<button class="btn alt" id="hm">رجوع</button></div>';
  app.innerHTML=h;$("#hm").onclick=home;
  if($("#chal"))$("#chal").onclick=function(){shareQuiz(q.name,q.code,q.cu)};
  [].forEach.call(document.querySelectorAll("[data-fi]"),function(r){r.onclick=function(){
    var x=f[+r.dataset.fi],box=$("#fi"+r.dataset.fi);
    if(!x.mask||x.mask.length!==QL.length){box.innerHTML="مفيش تفاصيل لنتيجة دي";}
    else box.innerHTML=QL.map(function(z,j){return (x.mask[j]==="1"?"✅ ":"❌ ")+esc(z.t)}).join("<br>");
    box.classList.toggle("hide")}});
}
function play(Q){
  document.title="اختبار "+Q.name+" | تعرفني قد إيه؟";
  $("#tag").textContent="اختبار "+Q.name+": تعرفه قد إيه؟";
  var d=load(),ans=[],i=0,who="";
  var L=Q.qs.map(function(q){var b=BANK[q[0]];return {t:b[0],o:b[1],a:q[1]}});
  if(Q.cu)L.push({t:Q.cu.q,o:Q.cu.o,a:Q.cu.a});
  Q.qs=L;
  app.innerHTML='<div class="card"><h2>🎮 تعرف '+esc(Q.name)+' قد إيه؟</h2><p>'+Q.qs.length+' أسئلة عن '+esc(Q.name)+'. جاوب بصراحة وشوف هتجيب كام.</p><input type="text" id="nm" maxlength="30" placeholder="اسمك" autocomplete="off" value="'+esc(d.name||"")+'"><button class="btn" id="go">ابدأ</button></div>';
  $("#go").onclick=function(){who=$("#nm").value.trim();if(!who){toast("اكتب اسمك الأول");return}d=load();d.name=who;save(d);step()};
  $("#nm").onkeydown=function(e){if(e.key==="Enter")$("#go").click()};
  function step(){
    if(i>=Q.qs.length)return fin();
    var q=[Q.qs[i].t,Q.qs[i].o],h='<div class="card"><div class="meta"><span>سؤال '+(i+1)+' من '+Q.qs.length+'</span><span>'+esc(Q.name)+'</span></div><div class="bar"><i style="width:'+(i/Q.qs.length*100)+'%"></i></div><p style="margin:16px 0 0;color:#7b6ca3">لو سألنا '+esc(Q.name)+':</p><h2 style="margin-top:4px">«'+esc(q[0])+'»</h2><div class="opts">';
    q[1].forEach(function(o,k){h+='<button class="opt" data-k="'+k+'">'+esc(o)+'</button>'});
    app.innerHTML=h+'</div></div>';
    [].forEach.call(document.querySelectorAll(".opt"),function(b){b.onclick=function(){
      var k=+b.dataset.k,right=Q.qs[i].a;ans[i]=k;
      [].forEach.call(document.querySelectorAll(".opt"),function(x){x.disabled=true;if(+x.dataset.k===right)x.classList.add("ok")});
      if(k!==right)b.classList.add("no");
      setTimeout(function(){i++;step()},650);
    }});
  }
  function fin(){
    var sc=0;Q.qs.forEach(function(q,k){if(ans[k]===q.a)sc++});
    var r=rankOf(sc/Q.qs.length),qk=key(Q.name,Q.code+(Q.cuRaw?decodeURIComponent(Q.cuRaw):""));
    if(sc/Q.qs.length>=.8)setTimeout(confetti,200);
    var h='<div class="card"><div class="rank">'+r[0]+'</div><div class="big">'+sc+' / '+Q.qs.length+'</div><p class="rank" style="font-size:18px">'+r[1]+'</p>';
    h+='<button class="btn alt" id="img">شارك النتيجة كصورة 🖼️</button><button class="btn wa" id="wa">ابعت نتيجتك لـ'+esc(Q.name)+'</button><button class="btn" id="mine">اعمل اختبارك انت كمان</button><button class="btn alt" id="rv">شوف الإجابات</button></div><div class="card hide" id="rvc"><h2>الإجابات الصح</h2>';
    Q.qs.forEach(function(q,k){h+='<div class="rev"><b>'+esc(q.t)+'</b>'+(ans[k]===q.a?'✅ ':'❌ ')+esc(q.o[q.a])+(ans[k]===q.a?'':' <span style="color:#9a8bbd">(إنت اخترت: '+esc(q.o[ans[k]])+')</span>')+'</div>'});
    app.innerHTML=h+'</div>';
    var mask=Q.qs.map(function(q,k){return ans[k]===q.a?"1":"0"}).join("");var rl=base()+"#r="+qk+"~"+encodeURIComponent(who)+"~"+sc+"~"+Q.qs.length+"~"+mask;
    var msg="جبت "+sc+" من "+Q.qs.length+" في اختبار «تعرفني قد إيه» بتاعك 😄\nافتح الرابط عشان نتيجتي تتسجل عندك:\n"+rl;
    $("#wa").onclick=function(){openShare(msg,rl,"نتيجتي")};
    $("#img").onclick=function(){cardImg(who,Q.name,sc,Q.qs.length,r,rl,msg)};
    $("#mine").onclick=function(){location.hash="";home()};
    $("#rv").onclick=function(){$("#rvc").classList.toggle("hide")};
  }
}
function cardImg(who,owner,sc,n,r,rl,msg){
  var c=document.createElement("canvas");c.width=1080;c.height=1350;var x=c.getContext("2d"),F="system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif";
  var g=x.createLinearGradient(0,0,1080,1350);g.addColorStop(0,"#4c1d95");g.addColorStop(.5,"#6d28d9");g.addColorStop(1,"#db2777");x.fillStyle=g;x.fillRect(0,0,1080,1350);
  x.fillStyle="#fff";x.direction="rtl";x.textAlign="center";
  x.font="bold 64px "+F;x.fillText("تعرفني قد إيه؟",540,170);
  x.font="48px "+F;x.fillText(who+" جاب في اختبار "+owner,540,300);
  x.fillStyle="rgba(255,255,255,.15)";x.beginPath();x.arc(540,650,260,0,Math.PI*2);x.fill();
  x.fillStyle="#fff";x.font="bold 260px "+F;x.fillText(sc+"/"+n,540,720);
  x.font="bold 56px "+F;var t=r[1];if(x.measureText(t).width>940){x.font="bold 44px "+F}x.fillText(t,540,1040);
  x.font="42px "+F;x.fillText("جرب انت كمان واعمل اختبارك",540,1180);
  x.font="32px "+F;x.fillStyle="#f3d9ff";x.fillText("mohamedelsayed16399-bit.github.io/taarafni",540,1270);
  c.toBlob(function(b){var f=new File([b],"natiga.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],text:msg}).catch(function(){})}
    else{var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="natiga.png";document.body.appendChild(a);a.click();a.remove();toast("اتنزلت الصورة ✔")}
  },"image/png");
}
function result(R){
  var d=load(),mine=(d.mine||[]).filter(function(x){return x.key===R.quiz})[0];
  if(!mine){
    app.innerHTML='<div class="card"><h2>'+esc(R.who)+' جاب '+R.score+' من '+R.of+'</h2><p>النتيجة دي لاختبار مش محفوظ على الجهاز ده. اعمل اختبارك انت وشوف أصحابك يعرفوك قد إيه.</p><button class="btn" id="mine">اعمل اختبارك</button></div>';
    $("#mine").onclick=function(){location.hash="";home()};return;
  }
  d.friends=d.friends||{};var l=d.friends[R.quiz]=d.friends[R.quiz]||[];
  var ex=l.filter(function(x){return x.who===R.who})[0];
  if(ex){ex.score=R.score;ex.of=R.of;ex.mask=R.mask}else l.push({who:R.who,score:R.score,of:R.of,mask:R.mask});
  save(d);
  history.replaceState(null,"",location.pathname);
  toast("اتسجلت نتيجة "+R.who+" ✔");
  board(R.quiz);
}
function route(){
  var p=parseHash();
  if(!p){home();return}
  if(p.type==="quiz")play(p);else result(p);
}
window.addEventListener("hashchange",route);
route();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
